services:
  - type: web
    name: standard-barber-robotia
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: VOICE_API_URL
        sync: false
      - key: VOICE_API_KEY
        sync: false
      - key: VOICE_ASSISTANT_ID
        sync: false
